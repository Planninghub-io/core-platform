
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Generator</title>
    
    <!-- Facebook Pixel Code - Completely reworked to eliminate preload warnings -->
    <script>
      // Don't create any network requests until user interaction
      window.fbq = function() {
        // Create a queue to store calls until the script is actually loaded
        (window._fbq = window._fbq || []).push(arguments);
      };
      
      // Function to actually load the Facebook Pixel script
      function loadFbPixel() {
        // Don't load multiple times
        if (window._fbPixelLoaded) return;
        window._fbPixelLoaded = true;
        
        // Create and append the script element
        const script = document.createElement('script');
        script.src = 'https://connect.facebook.net/en_US/fbevents.js';
        script.async = true;
        
        // When script loads, initialize properly
        script.onload = function() {
          // Re-initialize fbq now that the script is loaded
          window.fbq('init', '9151671744940732');
          window.fbq('track', 'PageView');
        };
        
        // Append the script to the DOM - this is when the network request happens
        document.head.appendChild(script);
      }
      
      // Create a no-op function that we can use to delay loading
      function setupDelayedLoading() {
        // Only load on deliberate user interaction or after a significant delay
        document.addEventListener('click', loadFbPixel, { once: true });
        document.addEventListener('scroll', loadFbPixel, { once: true });
        
        // Wait 15 seconds before loading if no user interaction
        // This is a very generous delay to ensure no preload warnings
        setTimeout(loadFbPixel, 15000);
      }
      
      // Attach the delayed loading function
      if (document.readyState === 'complete') {
        setupDelayedLoading();
      } else {
        window.addEventListener('load', setupDelayedLoading);
      }
    </script>
    <!-- End Facebook Pixel Code -->
  </head>
  <body>
    <noscript>
      <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=9151671744940732&ev=PageView&noscript=1" alt="Facebook Pixel"/>
    </noscript>
    
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
