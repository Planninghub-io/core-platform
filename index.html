
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Generator</title>
    
    <!-- Facebook Pixel Code - Modified to prevent preload warnings -->
    <script>
      // Defer Facebook Pixel loading until user interaction or when actually needed
      function loadFbPixel() {
        if (window.fbPixelLoaded) return;
        
        const script = document.createElement('script');
        script.src = 'https://connect.facebook.net/en_US/fbevents.js';
        script.async = true;
        document.head.appendChild(script);
        
        script.onload = function() {
          window.fbq = window.fbq || function() {
            (window.fbq.q = window.fbq.q || []).push(arguments);
          };
          window.fbq.loaded = true;
          window.fbq.version = '2.0';
          window.fbq('init', '9151671744940732');
          window.fbq('track', 'PageView');
          
          window.fbPixelLoaded = true;
        };
      }
      
      // Defer Facebook Pixel loading
      if (document.readyState === 'complete') {
        // Add event listeners to track actual user engagement
        document.addEventListener('click', loadFbPixel, { once: true });
        document.addEventListener('scroll', loadFbPixel, { once: true });
        // Only load after 10 seconds if no interaction (increased from 5 seconds)
        setTimeout(loadFbPixel, 10000);
      } else {
        document.addEventListener('DOMContentLoaded', function() {
          // Add event listeners to track actual user engagement
          document.addEventListener('click', loadFbPixel, { once: true });
          document.addEventListener('scroll', loadFbPixel, { once: true });
          // Only load after 10 seconds if no interaction (increased from 5 seconds)
          setTimeout(loadFbPixel, 10000);
        });
      }
    </script>
    <!-- End Facebook Pixel Code -->
  </head>
  <body>
    <noscript>
      <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=9151671744940732&ev=PageView&noscript=1" alt="Facebook Pixel"/>
    </noscript>
    
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
