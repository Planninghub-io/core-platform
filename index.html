
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Generator</title>
    
    <!-- Facebook Pixel Code - Revised implementation -->
    <script>
      // Define a single source of truth for Facebook Pixel
      window.fbPixelId = '9151671744940732';
      
      // Create a stub function that just queues commands without making network requests
      window.fbq = function() {
        // Store commands in _fbq array for later execution
        (window._fbq = window._fbq || []).push(arguments);
      };
      
      // Flag to track if we've already loaded the pixel
      window._fbPixelLoaded = false;
      
      // Function to load Facebook Pixel only when needed
      function loadFbPixel() {
        // Prevent multiple loads
        if (window._fbPixelLoaded) return;
        window._fbPixelLoaded = true;
        
        // Create and load the script
        const script = document.createElement('script');
        script.src = 'https://connect.facebook.net/en_US/fbevents.js';
        script.async = true;
        
        // Initialize properly when loaded
        script.onload = function() {
          window.fbq('init', window.fbPixelId);
          window.fbq('track', 'PageView');
        };
        
        // Append to document (this is when the network request happens)
        document.head.appendChild(script);
      }
      
      // Only attach event listeners when DOM is ready
      function setupDeferredLoading() {
        // Use passive listeners to not block rendering
        document.addEventListener('click', function() {
          if (window.requestIdleCallback) {
            window.requestIdleCallback(loadFbPixel);
          } else {
            setTimeout(loadFbPixel, 1);
          }
        }, { once: true, passive: true });
        
        document.addEventListener('scroll', function() {
          if (window.requestIdleCallback) {
            window.requestIdleCallback(loadFbPixel);
          } else {
            setTimeout(loadFbPixel, 1);
          }
        }, { once: true, passive: true });
        
        // Load after 30 seconds if no interaction
        setTimeout(loadFbPixel, 30000);
      }
      
      // Defer the event listener setup
      if (document.readyState === 'complete') {
        setTimeout(setupDeferredLoading, 1000);
      } else {
        window.addEventListener('load', function() {
          setTimeout(setupDeferredLoading, 1000);
        });
      }
    </script>
    <!-- End Facebook Pixel Code -->
  </head>
  <body>
    <noscript>
      <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=9151671744940732&ev=PageView&noscript=1" alt="Facebook Pixel"/>
    </noscript>
    
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
