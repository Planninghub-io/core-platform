
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Generator</title>
    
    <!-- Facebook Pixel Code - Modified for performance -->
    <script>
      // Only load Facebook Pixel when actually needed (on user interaction)
      function loadFbPixel() {
        if (window.fbPixelLoaded) return;
        
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '9151671744940732');
        fbq('track', 'PageView');
        
        window.fbPixelLoaded = true;
      }
      
      // Defer Facebook Pixel loading
      document.addEventListener('DOMContentLoaded', function() {
        // Add event listeners to track actual user engagement
        document.addEventListener('click', loadFbPixel, { once: true });
        document.addEventListener('scroll', loadFbPixel, { once: true });
        // Only load after 5 seconds if no interaction
        setTimeout(loadFbPixel, 5000);
      });
    </script>
    <!-- End Facebook Pixel Code -->
  </head>
  <body>
    <noscript>
      <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=9151671744940732&ev=PageView&noscript=1" alt="Facebook Pixel"/>
    </noscript>
    
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
